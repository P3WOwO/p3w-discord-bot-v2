name: Temporary npm security audit

on:
  push:
    branches:
      - security/audit-review

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install dependencies and regenerate lockfile
        run: npm install --no-audit
      - name: Smoke test Discord and audio dependencies
        run: |
          node <<'NODE'
          const modules = [
            '@discordjs/opus',
            '@discordjs/voice',
            'discord.js',
            'distube',
            '@distube/spotify',
            '@distube/youtube',
            'distube-yandex-music-plugin',
          ];
          for (const name of modules) {
            require(name);
            console.log('OK ' + name);
          }
          NODE
      - name: Run npm audit
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_status=$?
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const metadata = report.metadata?.vulnerabilities || {};
          console.log('Vulnerability totals:', JSON.stringify(metadata));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            console.log(JSON.stringify({
              name, severity: item.severity, isDirect: item.isDirect,
              range: item.range, installed: item.nodes,
              fixAvailable: item.fixAvailable, via: item.via
                .filter(v => typeof v === 'object')
                .map(v => ({ title: v.title, url: v.url, range: v.range, cwe: v.cwe, cvss: v.cvss?.score }))
            }));
          }
          const fs2 = require('node:fs');
          fs2.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## npm audit results\n\n```json\n' + JSON.stringify(metadata, null, 2) + '\n```\n\n' +
            Object.entries(report.vulnerabilities || {}).map(([name, item]) =>
              '- **' + name + '** — ' + item.severity + '; direct: ' + item.isDirect +
              '; fixAvailable: ' + JSON.stringify(item.fixAvailable) + '; range: `' + item.range + '`'
            ).join('\n') + '\n');
          NODE
          echo "audit_exit_code=$audit_status" >> "$GITHUB_OUTPUT"
      - name: Upload full audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: |
            npm-audit.json
            package-lock.json
          if-no-files-found: warn
          retention-days: 3
      - name: Save regenerated lockfile on diagnostic branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "test: commit audited dependency lockfile [skip ci]"
            git push origin HEAD:security/audit-review
          fi
      - name: Keep diagnostic run successful
        if: always()
        run: echo "Audit finished; advisory details are in the uploaded artifact and job summary."
